services:
  risk-runner:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      RISK_RUNNER_DATABASE_URL: postgresql+psycopg://risk:risk@db:5432/risk_runner
    depends_on:
      - db
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: risk
      POSTGRES_PASSWORD: risk
      POSTGRES_DB: risk_runner
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
