[project]
name = "risk-runner"
version = "0.1.0"
description = "Risk Runner: business-aware application security posture management"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
risk-runner = "risk_runner:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]
