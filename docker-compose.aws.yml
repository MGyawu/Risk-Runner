# Production-style stack for a single server (e.g. AWS EC2):
#   Caddy (HTTPS, automatic Let's Encrypt cert) -> Risk Runner -> Postgres
# Only ports 80/443 are published; the app and database stay on the private Docker network.
# Usage: docker compose -f docker-compose.aws.yml up -d --build
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - risk-runner

  risk-runner:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      RISK_RUNNER_DATABASE_URL: postgresql+psycopg://risk:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/risk_runner
      RISK_RUNNER_CORS_ORIGINS: '["https://${DOMAIN}"]'
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: risk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: risk_runner
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risk -d risk_runner"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
  caddy_data:
