# Production-style stack for a single server (e.g. AWS EC2):
#   Caddy (HTTPS, automatic Let's Encrypt cert) -> Risk Runner -> Amazon RDS (PostgreSQL)
# Only ports 80/443 are published. The database is RDS, reached through RISK_RUNNER_DATABASE_URL
# in .env (deploy/deploy.sh writes it from Parameter Store).
# Usage: docker compose -f docker-compose.aws.yml up -d --build
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - risk-runner

  risk-runner:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      RISK_RUNNER_DATABASE_URL: ${RISK_RUNNER_DATABASE_URL:?set RISK_RUNNER_DATABASE_URL in .env}
      RISK_RUNNER_CORS_ORIGINS: '["https://${DOMAIN}"]'

volumes:
  # Data of the old Postgres container. Nothing uses it now, but it's kept so the data stays
  # available for migration or rollback. Remove it with `docker volume rm risk-runner_pgdata`.
  pgdata:
  caddy_data:
