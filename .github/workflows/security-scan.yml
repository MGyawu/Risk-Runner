# Risk Runner scanning itself: SAST (Semgrep), SCA (Trivy) and DAST (ZAP).
#
# Results always show up in this run (job summaries, downloadable report artifacts, and
# Semgrep/Trivy alerts under Security > Code scanning). They are also uploaded to a Risk Runner
# server when the repository secrets RISK_RUNNER_URL and RISK_RUNNER_TOKEN are set; until then
# the upload steps are skipped.
name: Security scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC, catches newly published CVEs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      RR_URL: ${{ secrets.RISK_RUNNER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install semgrep
      - name: Run Semgrep
        run: semgrep scan --config p/default --sarif --output semgrep.sarif --metrics off --exclude backend/tests/fixtures
      - uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif
      - name: Show in GitHub code scanning
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Upload to Risk Runner
        if: env.RR_URL != ''
        uses: ./action
        with:
          server-url: ${{ secrets.RISK_RUNNER_URL }}
          token: ${{ secrets.RISK_RUNNER_TOKEN }}
          report: semgrep.sarif
          scan-type: sast

  sca:
    name: SCA (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      RR_URL: ${{ secrets.RISK_RUNNER_URL }}
    steps:
      - uses: actions/checkout@v4
      # Scans backend/uv.lock and frontend/package-lock.json
      - name: Run Trivy (JSON for Risk Runner)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: json
          output: trivy.json
      - name: Run Trivy (SARIF for GitHub)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: sarif
          output: trivy.sarif
      - uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy.json
      - name: Show in GitHub code scanning
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy
      - name: Upload to Risk Runner
        if: env.RR_URL != ''
        uses: ./action
        with:
          server-url: ${{ secrets.RISK_RUNNER_URL }}
          token: ${{ secrets.RISK_RUNNER_TOKEN }}
          report: trivy.json

  dast:
    name: DAST (ZAP baseline)
    runs-on: ubuntu-latest
    env:
      RR_URL: ${{ secrets.RISK_RUNNER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build dashboard
        working-directory: frontend
        run: npm ci && npm run build
      # Runs Risk Runner inside this runner only (localhost), with a throwaway SQLite database.
      - name: Start Risk Runner
        working-directory: backend
        env:
          RISK_RUNNER_ENRICHMENT_ENABLED: "false"
          RISK_RUNNER_INGEST_TOKEN: dast-scan-only
        run: |
          uv sync
          nohup uv run risk-runner > "$RUNNER_TEMP/risk-runner.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8000/api/health && exit 0
            sleep 2
          done
          echo "Risk Runner did not start"; cat "$RUNNER_TEMP/risk-runner.log"; exit 1
      - name: Run ZAP baseline
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:8000
          cmd_options: "-J zap.json"
          allow_issue_writing: false
          fail_action: false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-json-report
          path: zap.json
      - name: Upload to Risk Runner
        if: env.RR_URL != ''
        uses: ./action
        with:
          server-url: ${{ secrets.RISK_RUNNER_URL }}
          token: ${{ secrets.RISK_RUNNER_TOKEN }}
          report: zap.json
